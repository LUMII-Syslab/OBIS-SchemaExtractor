spring.servlet.multipart.max-file-size = 100MB
spring.servlet.multipart.max-request-size = 100MB

# include error messages in error responses
spring.web.error.include-message = always

# Swagger UI / OpenAPI (springdoc) settings
springdoc.api-docs.enabled = true
springdoc.swagger-ui.enabled = true
# full class names as model names - V1 and V2 models have the same simple class names (e.g. Schema)
springdoc.use-fqn = true
# open the V2 specification by default and keep operations collapsed
springdoc.swagger-ui.urls-primary-name = Schema Extractor API - Current V2
springdoc.swagger-ui.doc-expansion = none
# request bodies of all services are file uploads
springdoc.default-consumes-media-type = multipart/form-data