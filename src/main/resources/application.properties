spring.servlet.multipart.max-file-size = 100MB
spring.servlet.multipart.max-request-size = 100MB

# Explicitly enable API documentation and Swagger UI.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Retain the existing entry URL and keep the V1 and V2 models distinct.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls-primary-name=current-v2
springdoc.use-fqn=true

# Keep Schemas collapsed until the user opens it.
springdoc.swagger-ui.defaultModelsExpandDepth=0
